<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyLog — Ryanair → PilotLog</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f81f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EasyLog">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --surface2: #1c2128;
    --border:   #30363d;
    --accent:   #2f81f7;
    --acc-dim:  rgba(47,129,247,.12);
    --text:     #e6edf3;
    --muted:    #7d8590;
    --green:    #3fb950;
    --amber:    #d29922;
    --red:      #f85149;
    --radius:   10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  /* ── Header ── */
  header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.5rem; }
  .logo  { font-size: 1.75rem; font-weight: 800; letter-spacing: -.5px; }
  .logo span { color: var(--accent); }
  .tagline { color: var(--muted); font-size: .9rem; }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .card-title {
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  /* ── Role selector ── */
  .roles { display: flex; gap: .75rem; }
  .role {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .75rem;
    padding: .85rem 1rem;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  .role:hover    { border-color: var(--accent); }
  .role.active   { border-color: var(--accent); background: var(--acc-dim); }
  .role input    { display: none; }
  .role-label    { font-weight: 600; font-size: .95rem; }
  .role-sub      { font-size: .78rem; color: var(--muted); }
  .badge {
    padding: .2rem .55rem;
    border-radius: 5px;
    font-size: .7rem;
    font-weight: 700;
    background: var(--border);
    color: var(--muted);
  }
  .role.active .badge { background: var(--accent); color: #fff; }

  /* ── Textarea ── */
  textarea {
    width: 100%;
    height: 220px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: .8rem;
    line-height: 1.5;
    padding: .85rem 1rem;
    resize: vertical;
    outline: none;
    transition: border-color .15s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    padding: .65rem 1.5rem;
    border: none;
    border-radius: 8px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s, opacity .15s;
  }
  .btn:hover  { filter: brightness(1.12); }
  .btn:active { filter: brightness(.92); }
  .btn-blue   { background: var(--accent); color: #fff; }
  .btn-green  { background: var(--green); color: #fff; }
  .btn-ghost  { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }

  .actions { display: flex; gap: .75rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }

  /* ── Status pill ── */
  .status {
    padding: .45rem 1rem;
    border-radius: 20px;
    font-size: .82rem;
    font-weight: 500;
  }
  .status-ok  { background: rgba(63,185,80,.12); color: var(--green); border: 1px solid rgba(63,185,80,.3); }
  .status-err { background: rgba(248,81,73,.12); color: var(--red);   border: 1px solid rgba(248,81,73,.3); }

  /* ── Stats row ── */
  .stats { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .stat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .6rem 1.1rem;
    min-width: 100px;
    text-align: center;
  }
  .stat-val  { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .stat-lbl  { font-size: .7rem; color: var(--muted); margin-top: .15rem; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  th {
    text-align: left;
    padding: .5rem .75rem;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
  }
  td {
    padding: .45rem .75rem;
    border-bottom: 1px solid rgba(48,54,61,.6);
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(47,129,247,.04); }

  /* ── Tags ── */
  .tag {
    display: inline-block;
    padding: .1rem .4rem;
    border-radius: 4px;
    font-size: .68rem;
    font-weight: 700;
  }
  .tag-800  { background: rgba(63,185,80,.14); color: var(--green); }
  .tag-8200 { background: rgba(47,129,247,.14); color: var(--accent); }
  .tag-pf   { background: rgba(210,153,34,.14); color: var(--amber); }

  .hidden { display: none !important; }

  .warn-list {
    margin-top: .75rem;
    padding: .75rem 1rem;
    background: rgba(210,153,34,.08);
    border: 1px solid rgba(210,153,34,.3);
    border-radius: 8px;
    font-size: .82rem;
    color: var(--amber);
  }
  .warn-list li { margin-left: 1.2rem; margin-top: .25rem; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="logo">Easy<span>Log</span></div>
      <div class="tagline">Convierte emails de vuelos Ryanair al formato CSV de PilotLog</div>
    </div>
  </header>

  <!-- Rol -->
  <div class="card">
    <div class="card-title">Tu rol en este período</div>
    <div class="roles">
      <label class="role active" id="lbl-fo">
        <input type="radio" name="role" value="FO" checked>
        <div>
          <div class="role-label">Primer Oficial</div>
          <div class="role-sub">Horas como SIC</div>
        </div>
        <span class="badge">FO / SIC</span>
      </label>
      <label class="role" id="lbl-cpt">
        <input type="radio" name="role" value="CPT">
        <div>
          <div class="role-label">Comandante</div>
          <div class="role-sub">Horas como PIC</div>
        </div>
        <span class="badge">CPT / PIC</span>
      </label>
    </div>
  </div>

  <!-- Input -->
  <div class="card">
    <div class="card-title">Emails de vuelos (pega aquí uno o varios meses)</div>
    <textarea id="input" placeholder="Pega aquí el contenido de los emails...&#10;&#10;Puedes pegar varios días o meses juntos, el sistema los separará automáticamente."></textarea>
    <div class="actions">
      <button class="btn btn-blue" onclick="convert()">Convertir</button>
      <button class="btn btn-ghost" onclick="clearAll()">Limpiar</button>
      <span id="status" class="status hidden"></span>
    </div>
  </div>

  <!-- Resultados -->
  <div class="card hidden" id="results">
    <div class="card-title">Vuelos procesados</div>

    <div class="stats" id="stats"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Vuelo</th>
            <th>Ruta</th>
            <th>Off→On Block</th>
            <th>Bloque</th>
            <th>Vuelo</th>
            <th>Matrícula</th>
            <th>Modelo</th>
            <th>Capitán</th>
            <th>PF</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div id="warnings" class="hidden"></div>

    <div class="actions" style="margin-top:1.25rem">
      <button class="btn btn-green" onclick="downloadCSV()">⬇ Descargar CSV</button>
      <a class="btn btn-blue" href="https://my.crewlounge.center/pilotlog-import-wizard" target="_blank"
         style="text-decoration:none;">Abrir Import Wizard ↗</a>
    </div>
  </div>

</div>

<script>
// ─── IATA AHM730 delay codes → CrewLounge PILOTLOG enum names ────────────────
// CrewLounge import expects the category NAME (uppercase), not the IATA number.
// Multi-delay rows use "|" as separator and only enum names are accepted.
const DELAY_CODES = {
  11:'BOARDING', 12:'BOARDING', 13:'BOARDING', 14:'OVERSALES', 15:'BOARDING',
  16:'BOARDING', 17:'BOARDING', 18:'BOARDING', 19:'REDUCED MOBILITY',
  21:'CARGO DOCUMENTATION', 22:'CARGO DOCUMENTATION', 23:'CARGO DOCUMENTATION',
  24:'CARGO DOCUMENTATION', 25:'OVERSALES', 26:'CARGO DOCUMENTATION',
  27:'CARGO DOCUMENTATION', 28:'LATE / INACCURATE AIRCRAFT DOCUMENTATION',
  29:'CARGO DOCUMENTATION',
  31:'LATE / INACCURATE AIRCRAFT DOCUMENTATION', 32:'LOADING / UNLOADING',
  33:'TECHNICAL EQUIPMENT', 34:'TECHNICAL EQUIPMENT', 35:'AIRCRAFT CLEANING',
  36:'FUELLING / DEFUELLING', 37:'LOADING / UNLOADING', 38:'LOADING / UNLOADING',
  39:'TECHNICAL EQUIPMENT',
  41:'TECHNICAL DEFECTS', 42:'SCHEDULED MAINTENANCE', 43:'NON-SCHEDULED MAINTENANCE',
  44:'TECHNICAL EQUIPMENT', 45:'TECHNICAL EQUIPMENT', 46:'AIRCRAFT CHANGE',
  47:'AIRCRAFT CHANGE', 48:'AIRCRAFT CHANGE',
  51:'TECHNICAL DEFECTS', 52:'TECHNICAL DEFECTS',
  55:'OPERATIONS CONTROL', 56:'CARGO DOCUMENTATION', 57:'FLIGHT PLANS',
  58:'OPERATIONS CONTROL',
  61:'FLIGHT PLANS', 62:'OPERATIONAL REQUIREMENT', 63:'OPERATIONAL REQUIREMENT',
  64:'OPERATIONAL REQUIREMENT', 65:'OPERATIONAL REQUIREMENT',
  66:'CABIN CREW ERROR OR SPECIAL REQUEST', 67:'CABIN CREW ERROR OR SPECIAL REQUEST',
  68:'CABIN CREW ERROR OR SPECIAL REQUEST', 69:'MANDATORY SECURITY',
  71:'OPERATIONAL REQUIREMENT', 72:'OPERATIONAL REQUIREMENT',
  73:'OPERATIONAL REQUIREMENT', 75:'DE-ICING OF AIRCRAFT',
  76:'REMOVAL OF SNOW, ICE, WATER OR SAND FROM AIRPORT',
  77:'GROUND HANDLING IMPAIRED BY ADVERSE WEATHER CONDITIONS',
  81:'ATFM DUE TO ATC EN-ROUTE DEMAND / CAPACITY',
  82:'ATFM DUE TO ATC STAFF / EQUIPMENT ENROUTE',
  83:'RESTRICTIONS AT AIRPORT OF DEPARTURE',
  84:'OPERATIONAL REQUIREMENT', 85:'MANDATORY SECURITY',
  86:'IMMIGRATION, CUSTOMS, HEALTH', 87:'AIRPORT FACILITIES',
  88:'RESTRICTIONS AT AIRPORT OF DEPARTURE',
  89:'RESTRICTIONS AT AIRPORT OF DEPARTURE',
  91:'AIRCRAFT ROTATION', 92:'AIRCRAFT ROTATION', 93:'AIRCRAFT ROTATION',
  94:'AIRCRAFT ROTATION', 95:'AIRCRAFT ROTATION', 96:'OPERATIONS CONTROL',
  97:'OPERATIONAL REQUIREMENT', 98:'OPERATIONAL REQUIREMENT',
  99:'OPERATIONAL REQUIREMENT',
};

// ─── Role toggle ──────────────────────────────────────────────────────────────
document.querySelectorAll('input[name="role"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('lbl-fo').classList.toggle('active', r.value === 'FO');
    document.getElementById('lbl-cpt').classList.toggle('active', r.value === 'CPT');
  });
});
const role = () => document.querySelector('input[name="role"]:checked').value;

// ─── Aircraft model ───────────────────────────────────────────────────────────
// Registrations >= threshold (alphabetical suffix comparison) are B737-8200 MAX
const THRESHOLDS = { EI: 'HAA', '9H': 'VUA', SP: 'RZA' };

function formatReg(raw) {
  const r = raw.trim().toUpperCase().replace(/\s/g, '');
  return r.slice(0, 2) + '-' + r.slice(2);
}

function getVariant(raw) {
  const r = raw.trim().toUpperCase().replace(/\s/g, '');
  const prefix = r.slice(0, 2);
  const suffix = r.slice(2);
  const thr = THRESHOLDS[prefix];
  if (!thr) return '800';
  return suffix >= thr ? '8200' : '800';
}

// ─── Parser ───────────────────────────────────────────────────────────────────
function parseText(text) {
  const DATE_RE = /^\d{4}\/\d{2}\/\d{2}$/;
  const lines   = text.split('\n').map(l => l.trim());

  // Locate date-block starts
  const dateIdx = lines.reduce((acc, l, i) => {
    if (DATE_RE.test(l)) acc.push(i);
    return acc;
  }, []);

  if (!dateIdx.length)
    return { flights: [], warnings: ['No se encontraron fechas con formato YYYY/MM/DD.'] };

  const flights  = [];
  const warnings = [];

  dateIdx.forEach((start, di) => {
    const end      = di + 1 < dateIdx.length ? dateIdx[di + 1] : lines.length;
    const dayRaw   = lines.slice(start, end);
    const dayLines = dayRaw.filter(l => l !== '');
    const date     = dayLines[0];

    // Crew + captain selection
    const crewAt = dayLines.findIndex(l => /^flight deck crew\s*:?\s*$/i.test(l));
    const allCrew = [];
    if (crewAt !== -1) {
      for (let i = crewAt + 1; i < dayLines.length; i++) {
        const m = dayLines[i].match(/^(\S+)\s*:\s*([A-Z]{2,3})\s*:\s*(.+)$/);
        if (m) allCrew.push({ code: m[1].trim(), role: m[2].trim(), name: m[3].trim() });
      }
    } else {
      warnings.push(`Sin sección "Flight Deck Crew" — ${date}`);
    }

    // "Verified By : CODE , ROLE , ..." → captain priority
    let verifiedCode = '';
    for (const l of dayLines) {
      const m = l.match(/^verified by\s*:\s*(\S+)\s*,/i);
      if (m) { verifiedCode = m[1].trim(); break; }
    }

    const cps = allCrew.filter(c => c.role === 'CP');
    let captain = '', captainCode = '';
    const v = verifiedCode && cps.find(c => c.code === verifiedCode);
    if (v) { captain = v.name; captainCode = v.code; }
    else if (cps.length) { captain = cps[0].name; captainCode = cps[0].code; }

    // Flight block starts
    const flightAt = dayLines.reduce((acc, l, i) => {
      if (l.startsWith('FlightNumber :')) acc.push(i);
      return acc;
    }, []);

    flightAt.forEach((fStart, fi) => {
      const fEnd   = fi + 1 < flightAt.length
                       ? flightAt[fi + 1]
                       : (crewAt !== -1 ? crewAt : dayLines.length);
      const fLines = dayLines.slice(fStart, fEnd);

      // Parse all key : value pairs
      const d = {};
      fLines.forEach(line => {
        const m = line.match(/^(.+?)\s*:\s*(.*)$/);
        if (m) d[m[1].trim()] = m[2].trim();
      });

      if (!d['FlightNumber']) {
        warnings.push(`Vuelo sin número en ${date}`);
        return;
      }

      flights.push({ date, captain, captainCode, allCrew, d });
    });
  });

  return { flights, warnings };
}

// ─── CSV ──────────────────────────────────────────────────────────────────────
const SEP = ';';

// 99-column canonical CrewLounge PILOTLOG export format (verified against
// real export of FR8407 imported via native iOS PilotLog email parser).
const HEADER = [
  'PILOTLOG_DATE','IS_PREVEXP','AC_ISSIM','FLIGHTNUMBER','PAIRING',
  'AF_DEP','DEP_RWY','AF_ARR','ARR_RWY',
  'TIME_DEP','TIME_DEPSCH','TIME_ARR','TIME_ARRSCH','TIME_TO','TIME_LDG',
  'TIME_AIR','TIME_MODE','TIME_TOTAL','TIME_TOTALSIM',
  'TIME_PIC','TIME_SIC','TIME_DUAL','TIME_PICUS','TIME_INSTRUCTOR','TIME_EXAMINER',
  'TIME_NIGHT','TIME_XC','TIME_IFR','TIME_HOOD','TIME_ACTUAL','TIME_RELIEF',
  'TIME_USER1','TIME_USER2','TIME_USER3','TIME_USER4',
  'CAPACITY','OPERATOR',
  'PILOT1_ID','PILOT1_NAME','PILOT1_PHONE','PILOT1_EMAIL',
  'PILOT2_ID','PILOT2_NAME','PILOT2_PHONE','PILOT2_EMAIL',
  'PILOT3_ID','PILOT3_NAME','PILOT3_PHONE','PILOT3_EMAIL',
  'PILOT4_ID','PILOT4_NAME','PILOT4_PHONE','PILOT4_EMAIL',
  'TO_DAY','TO_NIGHT','LDG_DAY','LDG_NIGHT','LIFT','PF','HOLDING',
  'TAG_APP','TAG_OPS','TAG_LAUNCH','INSTRUCTION/TRAINING',
  'REMARKS','CREWLIST','FLIGHTLOG',
  'PAX','FUEL','FUELPLANNED','FUELUSED','TAG_DELAY','DEICE',
  'USER_NUMERIC','USER_TEXT','USER_YESNO',
  'AC_MAKE','AC_MODEL','AC_VARIANT','AC_REG','AC_FIN','AC_RATING',
  'AC_SP','AC_MP','AC_ME','AC_SPSE','AC_SPME','AC_CLASS',
  'AC_GLIDER','AC_ULTRALIGHT','AC_SEA',
  'AC_ENGINES','AC_ENGTYPE','AC_TAILWHEEL','AC_COMPLEX','AC_TMG',
  'AC_HEAVY','AC_HIGHPERF','AC_AEROBATIC','AC_SEATS',
].join(SEP);

// IATA → ICAO for common Ryanair destinations. Pass-through if not found.
const ICAO_MAP = {
  STN:'EGSS', LTN:'EGGW', BHX:'EGBB', MAN:'EGCC', LPL:'EGGP', EMA:'EGNX',
  EDI:'EGPH', GLA:'EGPF', BFS:'EGAA', NCL:'EGNT', BRS:'EGGD', LBA:'EGNM',
  DUB:'EIDW', ORK:'EICK', SNN:'EINN', NOC:'EIKN',
  MAD:'LEMD', BCN:'LEBL', AGP:'LEMG', PMI:'LEPA', ALC:'LEAL', VLC:'LEVC',
  SVQ:'LEZL', BIO:'LEBB', SCQ:'LEST', MAH:'LEMH', IBZ:'LEIB',
  TFS:'GCTS', LPA:'GCLP', ACE:'GCRR', FUE:'GCFV',
  CDG:'LFPG', BVA:'LFOB', NTE:'LFRS', BOD:'LFBD', MRS:'LFML', NCE:'LFMN',
  TLS:'LFBO', LIL:'LFQQ',
  FCO:'LIRF', CIA:'LIRA', MXP:'LIMC', BGY:'LIME', VCE:'LIPZ', BLQ:'LIPE',
  PSA:'LIRP', NAP:'LIRN', PMO:'LICJ', CTA:'LICC',
  FRA:'EDDF', HHN:'EDFH', BER:'EDDB', MUC:'EDDM', CGN:'EDDK', DUS:'EDDL',
  HAM:'EDDH', STR:'EDDS', NUE:'EDDN', LEJ:'EDDP', BRE:'EDDW',
  AMS:'EHAM', EIN:'EHEH', BRU:'EBBR', CRL:'EBCI',
  WAW:'EPWA', WMI:'EPMO', WRO:'EPWR', KRK:'EPKK', POZ:'EPPO', KTW:'EPKT',
  GDN:'EPGD', RZE:'EPRZ', LCJ:'EPLL',
  PRG:'LKPR', BUD:'LHBP', OTP:'LROP', SOF:'LBSF', ATH:'LGAV', SKG:'LGTS',
  RHO:'LGRP', HER:'LGIR', VIE:'LOWW', ZRH:'LSZH', GVA:'LSGG',
  CPH:'EKCH', BLL:'EKBI', OSL:'ENGM', TRF:'ENTO', RYG:'ENRY',
  ARN:'ESSA', GOT:'ESGG', NYO:'ESKN', VST:'ESOW',
  HEL:'EFHK', TLL:'EETN', RIX:'EVRA', VNO:'EYVI', KUN:'EYKA',
  TIA:'LATI', TGD:'LYPG', BEG:'LYBE', SJJ:'LQSA',
  LIS:'LPPT', OPO:'LPPR', FAO:'LPFR',
  CMN:'GMMN', AGA:'GMAD', RAK:'GMMX',
  TLV:'LLBG', AMM:'OJAI', CAI:'HECA', NBE:'DTNH',
};

function toIcao(code) {
  const c = (code || '').trim().toUpperCase();
  if (c.length === 4) return c;            // already ICAO
  return ICAO_MAP[c] || c;                 // map or pass through
}

// "2026/05/15" → "15/05/2026"
function toDmy(s) {
  const m = (s || '').match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : s;
}

// Heuristic: night if takeoff hour ≥ 19 or ≤ 5 (UTC).
function isNightFlight(timeStr) {
  const m = (timeStr || '').match(/^(\d{1,2}):/);
  if (!m) return false;
  const h = Number(m[1]);
  return h >= 19 || h <= 5;
}

function csv(v) {
  const s = String(v ?? '');
  return (s.includes(SEP) || s.includes('"') || s.includes('\n'))
    ? '"' + s.replace(/"/g, '""') + '"'
    : s;
}

// "01:15" → 75 minutes; "1:00" → 60
function hmToMin(s) {
  if (!s) return '';
  const m = s.trim().match(/^(\d+):(\d{1,2})$/);
  if (!m) return '';
  return Number(m[1]) * 60 + Number(m[2]);
}

// "01:00" → "1:00"
function stripLeadingZero(s) {
  if (!s) return '';
  return s.replace(/^0(\d:\d{2})$/, '$1');
}

function toRow(f, r) {
  const isCPT   = r === 'CPT';
  const d       = f.d;
  const date    = toDmy(f.date);
  const [depIata, arrIata] = (d['City Pair'] || '').split(' - ');
  const dep     = toIcao(depIata);
  const arr     = toIcao(arrIata);
  const reg     = formatReg(d['Registration'] || '');
  const variant = getVariant(d['Registration'] || '');
  const blockMin = hmToMin(d['Total Block']) || 0;
  const airHM    = stripLeadingZero(d['Total flight'] || '');
  const flightNo = (d['FlightNumber'] || '').replace(/\s+/g, '');
  const isMyTO  = (d['Take Off']  || '') === 'VEGRIC';
  const isMyLDG = (d['Landing']   || '') === 'VEGRIC';
  const night   = isNightFlight(d['Airborne']) ? blockMin : 0;

  // Crew list — "Flight Deck Crew|CODE   :   ROLE   :   NAME|..." (pipe-separated)
  const meRole = isCPT ? 'CP' : 'FO';
  const crewParts = ['Flight Deck Crew'];
  (f.allCrew || []).forEach(c => {
    if (c.code === 'VEGRIC') return;
    const role = c.role === 'CPT' ? 'CP' : c.role;
    crewParts.push(`${c.code}   :   ${role}   :   ${c.name}`);
  });
  crewParts.push(`VEGRIC   :   ${meRole}   :   RICARDO VEGA BURGUENO`);
  const crewList = crewParts.join('|');

  // Pilots — up to PILOT4. PIC of the flight is PILOT1, SELF goes to next slot.
  const otherCrew = (f.allCrew || []).filter(c => c.code !== 'VEGRIC');
  const pilots = [];
  if (isCPT) {
    pilots.push({ id:'VEGRIC', name:'SELF' });
    otherCrew.forEach(c => pilots.push({ id:c.code, name:c.name }));
  } else {
    // Captain first if known, then me, then any other crew
    if (f.captainCode) pilots.push({ id:f.captainCode, name:f.captain });
    pilots.push({ id:'VEGRIC', name:'SELF' });
    otherCrew.filter(c => c.code !== f.captainCode)
             .forEach(c => pilots.push({ id:c.code, name:c.name }));
  }
  while (pilots.length < 4) pilots.push({ id:'', name:'' });

  const timePic = isCPT ? blockMin : 0;
  const timeSic = isCPT ? 0        : blockMin;

  // Delay codes — TAG_DELAY uses CrewLounge canonical category names joined by "|"
  const delayNames = [];
  for (let n = 1; n <= 9; n++) {
    const c = d[`Delay Code ${n}`];
    if (!c) continue;
    const name = DELAY_CODES[Number(c)];
    if (name && !delayNames.includes(name)) delayNames.push(name);
  }
  const tagDelay = delayNames.join('|');

  // FLIGHTLOG — multi-line block with fuel/pax breakdown + report
  const captRem  = d['Captain Remarks'] || 'No Data Available';
  const fInfoRaw = d['Reason For Extra Fuel'] || '';
  const fInfo    = fInfoRaw.split('(')[0].trim().replace(/\s*-\s*$/, '');
  const noUplift = d['Reason for 0 Uplift'] || '';
  const logLines = [
    `F/Block: ${d['Block'] || ''}`,
    `F/Trip: ${d['Trip+Taxi'] || ''}`,
    `F/Res: ${d['Reserves'] || ''}`,
    `F/Uplift: ${d['Uplift'] || ''}`,
    `F/Arr: ${d['Arr'] || ''}`,
    `F/Diff: ${d['Burn Diff'] || ''}`,
    `F/Info: ${fInfo}`,
    `F/Uplift: ${noUplift}`,
    `Pax/A: ${d['Adult'] || ''}`,
    `Pax/C: ${d['Child'] || ''}`,
    `Pax/I: ${d['Infant'] || ''}`,
    `Cargo: ${d['Freight'] || ''}`,
    `PW: ${d['Placard Weight'] || ''}`,
  ];
  for (let n = 1; n <= 9; n++) {
    const t = d[`Delay Time ${n}`];
    if (t) logLines.push(`DT/${n}: ${t}`);
  }
  logLines.push(`Report: ${captRem}`);
  const flightLog = logLines.join('\n');

  // 99-column canonical row (verified field-by-field against FR8407 export)
  const vals = [
    /* 1 PILOTLOG_DATE */    date,
    /* 2 IS_PREVEXP */       'FALSE',
    /* 3 AC_ISSIM */         'FALSE',
    /* 4 FLIGHTNUMBER */     flightNo,
    /* 5 PAIRING */          '',
    /* 6 AF_DEP */           dep || '',
    /* 7 DEP_RWY */          '',
    /* 8 AF_ARR */           arr || '',
    /* 9 ARR_RWY */          '',
    /* 10 TIME_DEP */        d['Off Block'] || '',
    /* 11 TIME_DEPSCH */     d['STD'] || '',
    /* 12 TIME_ARR */        d['On Block'] || '',
    /* 13 TIME_ARRSCH */     d['STA'] || '',
    /* 14 TIME_TO */         d['Airborne'] || '',
    /* 15 TIME_LDG */        d['Landed'] || '',
    /* 16 TIME_AIR */        airHM,
    /* 17 TIME_MODE */       'UTC',
    /* 18 TIME_TOTAL */      blockMin,
    /* 19 TIME_TOTALSIM */   '',
    /* 20 TIME_PIC */        timePic,
    /* 21 TIME_SIC */        timeSic,
    /* 22 TIME_DUAL */       0,
    /* 23 TIME_PICUS */      0,
    /* 24 TIME_INSTRUCTOR */ 0,
    /* 25 TIME_EXAMINER */   0,
    /* 26 TIME_NIGHT */      night,
    /* 27 TIME_XC */         0,
    /* 28 TIME_IFR */        blockMin,
    /* 29 TIME_HOOD */       0,
    /* 30 TIME_ACTUAL */     0,
    /* 31 TIME_RELIEF */     0,
    /* 32 TIME_USER1 */      0,
    /* 33 TIME_USER2 */      0,
    /* 34 TIME_USER3 */      0,
    /* 35 TIME_USER4 */      0,
    /* 36 CAPACITY */        '',
    /* 37 OPERATOR */        'RYANAIR',
    /* 38 PILOT1_ID */       pilots[0].id,
    /* 39 PILOT1_NAME */     pilots[0].name,
    /* 40 PILOT1_PHONE */    '',
    /* 41 PILOT1_EMAIL */    '',
    /* 42 PILOT2_ID */       pilots[1].id,
    /* 43 PILOT2_NAME */     pilots[1].name,
    /* 44 PILOT2_PHONE */    '',
    /* 45 PILOT2_EMAIL */    '',
    /* 46 PILOT3_ID */       pilots[2].id,
    /* 47 PILOT3_NAME */     pilots[2].name,
    /* 48 PILOT3_PHONE */    '',
    /* 49 PILOT3_EMAIL */    '',
    /* 50 PILOT4_ID */       pilots[3].id,
    /* 51 PILOT4_NAME */     pilots[3].name,
    /* 52 PILOT4_PHONE */    '',
    /* 53 PILOT4_EMAIL */    '',
    /* 54 TO_DAY */          isMyTO  && !night ? 1 : 0,
    /* 55 TO_NIGHT */        isMyTO  &&  night ? 1 : 0,
    /* 56 LDG_DAY */         isMyLDG && !night ? 1 : 0,
    /* 57 LDG_NIGHT */       isMyLDG &&  night ? 1 : 0,
    /* 58 LIFT */            0,
    /* 59 PF */              (isMyTO || isMyLDG) ? 'TRUE' : 'FALSE',
    /* 60 HOLDING */         0,
    /* 61 TAG_APP */         '',
    /* 62 TAG_OPS */         '',
    /* 63 TAG_LAUNCH */      '',
    /* 64 INSTRUCTION */     '',
    /* 65 REMARKS */         flightNo,
    /* 66 CREWLIST */        crewList,
    /* 67 FLIGHTLOG */       flightLog,
    /* 68 PAX */             d['Actual Pax'] || '',
    /* 69 FUEL */            d['Dep'] || '',
    /* 70 FUELPLANNED */     d['Block'] || '',
    /* 71 FUELUSED */        d['Burn Off'] || '',
    /* 72 TAG_DELAY */       tagDelay,
    /* 73 DEICE */           'FALSE',
    /* 74 USER_NUMERIC */    0,
    /* 75 USER_TEXT */       '',
    /* 76 USER_YESNO */      'FALSE',
    /* 77 AC_MAKE */         'Boeing',
    /* 78 AC_MODEL */        'B737',
    /* 79 AC_VARIANT */      variant,
    /* 80 AC_REG */          reg,
    /* 81 AC_FIN */          '',
    /* 82 AC_RATING */       'B737-6/7/8/900',
    /* 83 AC_SP */           'FALSE',
    /* 84 AC_MP */           'TRUE',
    /* 85 AC_ME */           '',
    /* 86 AC_SPSE */         'FALSE',
    /* 87 AC_SPME */         'TRUE',
    /* 88 AC_CLASS */        'Aeroplane',
    /* 89 AC_GLIDER */       'FALSE',
    /* 90 AC_ULTRALIGHT */   'FALSE',
    /* 91 AC_SEA */          'FALSE',
    /* 92 AC_ENGINES */      'Multi',
    /* 93 AC_ENGTYPE */      'Turbine (jet-fan)',
    /* 94 AC_TAILWHEEL */    'FALSE',
    /* 95 AC_COMPLEX */      'FALSE',
    /* 96 AC_TMG */          'FALSE',
    /* 97 AC_HEAVY */        'TRUE',
    /* 98 AC_HIGHPERF */     'FALSE',
    /* 99 AC_AEROBATIC */    'FALSE',
    /* 100 AC_SEATS */       0,
  ];

  return vals.map(csv).join(SEP);
}

// ─── State ────────────────────────────────────────────────────────────────────
let _flights = [];
let _csv     = '';

// ─── Actions ─────────────────────────────────────────────────────────────────
function convert() {
  const text = document.getElementById('input').value;
  if (!text.trim()) { showStatus('err', 'Pega el contenido de los emails primero.'); return; }

  const { flights, warnings } = parseText(text);

  if (!flights.length) {
    showStatus('err', 'No se encontraron vuelos. Comprueba el formato del texto.');
    document.getElementById('results').classList.add('hidden');
    return;
  }

  _flights = flights;
  const r  = role();
  const rows = flights.map(f => toRow(f, r));
  _csv = '﻿' + HEADER + '\r\n' + rows.join('\r\n');

  // Preview table
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  flights.forEach(f => {
    const d       = f.d;
    const reg     = formatReg(d['Registration'] || '');
    const variant = getVariant(d['Registration'] || '');
    const model   = `B737-${variant}`;
    const [dep, arr] = (d['City Pair'] || '').split(' - ');
    const isMyTO  = (d['Take Off']  || '') === 'VEGRIC';
    const isMyLDG = (d['Landing']   || '') === 'VEGRIC';
    const isPF    = isMyTO || isMyLDG;
    const noCapt  = !f.captain;
    const [yy, mm, dd] = f.date.split('/');

    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td>${dd}/${mm}/${yy}</td>` +
      `<td><strong>${(d['FlightNumber'] || '').replace(/\s+/g, '')}</strong></td>` +
      `<td>${dep || '?'} → ${arr || '?'}</td>` +
      `<td style="color:var(--muted);font-size:.75rem">${d['Off Block'] || ''} → ${d['On Block'] || ''}</td>` +
      `<td><strong>${d['Total Block'] || ''}</strong></td>` +
      `<td>${d['Total flight'] || ''}</td>` +
      `<td style="font-family:monospace">${reg}</td>` +
      `<td><span class="tag ${variant === '8200' ? 'tag-8200' : 'tag-800'}">${model}</span></td>` +
      `<td style="${noCapt ? 'color:var(--red)' : ''}">${f.captain || '—'}</td>` +
      `<td>${isPF ? '<span class="tag tag-pf">PF</span>' : ''}</td>`;
    tbody.appendChild(tr);
  });

  // Stats
  const days    = new Set(flights.map(f => f.date)).size;
  const blkMins = flights.reduce((s, f) => s + toMins(f.d['Total Block']), 0);
  const airMins = flights.reduce((s, f) => s + toMins(f.d['Total flight']), 0);
  const pfCount = flights.filter(f => (f.d['Take Off'] || '') === 'VEGRIC').length;

  document.getElementById('stats').innerHTML =
    stat(flights.length, 'Vuelos') +
    stat(days, 'Días') +
    stat(fmtMins(blkMins), 'Horas bloque') +
    stat(fmtMins(airMins), 'Horas vuelo') +
    stat(pfCount, 'Como PF');

  // Warnings
  const wDiv = document.getElementById('warnings');
  if (warnings.length) {
    wDiv.innerHTML = `<ul class="warn-list">${warnings.map(w => `<li>${w}</li>`).join('')}</ul>`;
    wDiv.classList.remove('hidden');
  } else {
    wDiv.classList.add('hidden');
  }

  document.getElementById('results').classList.remove('hidden');
  showStatus('ok', `${flights.length} vuelo${flights.length > 1 ? 's' : ''} procesado${flights.length > 1 ? 's' : ''} correctamente.`);
}

function downloadCSV() {
  if (!_csv) return;
  const blob = new Blob([_csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), {
    href: url,
    download: `pilotlog_${new Date().toISOString().slice(0,10)}.csv`
  });
  a.click();
  URL.revokeObjectURL(url);
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('status').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  _flights = [];
  _csv = '';
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = `status status-${type}`;
  el.textContent = msg;
}

function stat(val, lbl) {
  return `<div class="stat"><div class="stat-val">${val}</div><div class="stat-lbl">${lbl}</div></div>`;
}

function toMins(s) {
  if (!s) return 0;
  const [h, m] = s.split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
}

function fmtMins(m) {
  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
}
